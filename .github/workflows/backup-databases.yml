name: Weekly Database Backup

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  PROD_DB_ID: 66db0f3c-8060-4222-ae66-539716e8a39a
  STAGING_DB_ID: 9c60f8cb-076b-4096-9db3-220890d90edc

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Get runner IP
        id: ip
        run: echo "runner_ip=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Whitelist runner IP on both databases
        env:
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          RUNNER_IP="${{ steps.ip.outputs.runner_ip }}"
          echo "Runner IP: $RUNNER_IP"

          for DB_ID in "$PROD_DB_ID" "$STAGING_DB_ID"; do
            # Get existing rules
            EXISTING=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/databases/${DB_ID}/firewall" \
              | python3 -c "
          import json, sys
          rules = json.load(sys.stdin).get('rules', [])
          out = [{'type': r['type'], 'value': r['value']} for r in rules]
          out.append({'type': 'ip_addr', 'value': '${RUNNER_IP}'})
          print(json.dumps({'rules': out}))
          ")

            # Update firewall with existing + runner IP
            curl -s -X PUT \
              -H "Authorization: Bearer $DO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$EXISTING" \
              "https://api.digitalocean.com/v2/databases/${DB_ID}/firewall" > /dev/null

            echo "Whitelisted $RUNNER_IP on database $DB_ID"
          done

          # Wait for firewall propagation
          sleep 15

      - name: Dump production database
        env:
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "Backing up production DB ($DATE)..."
          pg_dump "$PROD_DB_URL" --no-owner --no-acl -Fc -Z9 \
            -f /tmp/jarvis_prod_${DATE}.dump
          echo "Production dump size: $(du -sh /tmp/jarvis_prod_${DATE}.dump | cut -f1)"

      - name: Dump staging database
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "Backing up staging DB ($DATE)..."
          pg_dump "$STAGING_DB_URL" --no-owner --no-acl -Fc -Z9 \
            -f /tmp/jarvis_staging_${DATE}.dump
          echo "Staging dump size: $(du -sh /tmp/jarvis_staging_${DATE}.dump | cut -f1)"

      - name: Upload backups as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-backups-${{ github.run_id }}
          path: /tmp/jarvis_*.dump
          retention-days: 90
          if-no-files-found: error

      - name: Remove runner IP from firewall
        if: always()
        env:
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          RUNNER_IP="${{ steps.ip.outputs.runner_ip }}"

          for DB_ID in "$PROD_DB_ID" "$STAGING_DB_ID"; do
            EXISTING=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/databases/${DB_ID}/firewall" \
              | python3 -c "
          import json, sys
          rules = json.load(sys.stdin).get('rules', [])
          out = [{'type': r['type'], 'value': r['value']} for r in rules if r['value'] != '${RUNNER_IP}']
          print(json.dumps({'rules': out}))
          ")

            curl -s -X PUT \
              -H "Authorization: Bearer $DO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$EXISTING" \
              "https://api.digitalocean.com/v2/databases/${DB_ID}/firewall" > /dev/null

            echo "Removed $RUNNER_IP from database $DB_ID"
          done
