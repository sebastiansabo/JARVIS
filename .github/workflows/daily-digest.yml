name: Commits Digest

on:
  schedule:
    # Single trigger per period — the wide time guard in should_run()
    # absorbs GitHub Actions delays (typically 20-90 min).
    #
    # Daily digest — 05:00 UTC → 08:00 EEST / 07:00 EET
    #   Guard accepts hours 7-10, so covers both summer & winter.
    - cron: '0 5 * * *'
    # Weekly digest (Fri) — 14:00 UTC → 17:00 EEST / 16:00 EET
    #   Guard accepts hours 16-19 on Fridays.
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      period:
        description: 'Which digest to send (daily / weekly / monthly)'
        required: false
        default: 'daily'
        type: choice
        options:
          - 'daily'
          - 'weekly'
          - 'monthly'
      force_run:
        description: 'Bypass the time/day guard and send immediately'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-digest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        period:
          - daily
          - weekly
          - monthly
    steps:
      - name: Skip non-selected period on manual run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.period != matrix.period
        run: |
          echo "Manual run selected '${{ github.event.inputs.period }}', skipping '${{ matrix.period }}'."
          exit 0

      - name: Checkout JARVIS
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.period == matrix.period
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: JARVIS

      - name: Checkout jarvis-mobile
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.period == matrix.period
        uses: actions/checkout@v4
        with:
          repository: sebastiansabo/jarvis-mobile
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          path: jarvis-mobile

      - name: Set up Python
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.period == matrix.period
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.period == matrix.period
        run: pip install --no-cache-dir anthropic

      - name: Generate and send ${{ matrix.period }} digest
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.period == matrix.period
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: JARVIS Digest
          JARVIS_PATH: ${{ github.workspace }}/JARVIS
          MOBILE_PATH: ${{ github.workspace }}/jarvis-mobile
          DIGEST_PERIOD: ${{ matrix.period }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '0' }}
        run: python JARVIS/scripts/daily_digest.py
